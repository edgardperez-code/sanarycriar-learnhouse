name: Sanar y Criar image

# Sanar y Criar: builds the all-in-one image of this fork (root Dockerfile) and
# pushes it to GHCR as ghcr.io/<owner>/sanarycriar-lms.
#   - push to the "sanarycriar" branch -> :sanarycriar and :sha-<short>
#   - tag sc-vX.Y.Z                    -> :sc-vX.Y.Z and :sha-<short>  (use these in production)
# Tags must not start with a digit: upstream's release.yaml reacts to those.
# This repository is public, so the source of every published image is
# available (AGPL-3.0 section 13); the OCI source label links the package to it.
on:
  push:
    branches:
      - sanarycriar
    tags:
      - 'sc-v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/cli/**'
      - 'apps/e2e/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# Sanar y Criar: every action is pinned to a full commit SHA (version in the
# comment): this job can push images, so a moved tag must not run new code here.
# Bump them deliberately (Dependabot/Renovate understand this format).
permissions:
  contents: read
  packages: write

concurrency:
  group: sanarycriar-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse Enterprise folders
        # apps/api/ee/hooks.py would switch on Enterprise license checks.
        run: |
          if [ -e apps/api/ee ] || [ -e apps/web/ee ]; then
            echo "::error::apps/*/ee must not exist in this fork"
            exit 1
          fi

      - name: Image name and tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/sanarycriar-lms"
          short="${GITHUB_SHA::7}"
          tags="${image}:sha-${short}"
          # Docker tags allow [A-Za-z0-9_.-] only.
          ref_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')"
          tags="${tags},${image}:${ref_tag}"
          {
            echo "image=${image}"
            echo "short=${short}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            LEARNHOUSE_PUBLIC=true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Sanar y Criar LMS
            org.opencontainers.image.description=Fork de LearnHouse para cursos.sanarycriarve.com
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=sanarycriar-image
          cache-to: type=gha,mode=max,scope=sanarycriar-image

      - name: Check the pushed image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker run --rm --entrypoint sh \
            -e LEARNHOUSE_AUTH_JWT_SECRET_KEY=ci-only-placeholder-secret-0123456789abcdef \
            "$IMAGE" -c 'ffmpeg -version | head -n 1 && test ! -e /app/api/ee && cd /app/api && .venv/bin/alembic heads'
          {
            echo "### Imagen publicada"
            echo
            echo "\`${TAGS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
